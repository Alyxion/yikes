[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "yikes"
version = "0.1.0"
description = "Unified chatbot driver for Claude Code and Codex CLI"
readme = "README.md"
requires-python = ">=3.14,<4.0"
dependencies = [
  "fastapi>=0.100",
  "llming-com>=0.1.7",
  "llming-stage>=0.1.1",
  "rich>=14",
  "textual>=6",
  "typer>=0.12",
  "uvicorn[standard]>=0.27",
  "websockets>=16",
]

[project.optional-dependencies]
test = ["httpx>=0.27", "pytest>=8"]

[project.scripts]
yikes = "yikes.cli:main"

[tool.poetry]
packages = [{ include = "yikes" }]
include = [
  { path = "yikes/web_static/**/*", format = ["sdist", "wheel"] },
]

[tool.poetry.group.dev.dependencies]
httpx = ">=0.27"
pytest = ">=8"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: real end-to-end tests that invoke Claude Code, Codex, and tmux",
]

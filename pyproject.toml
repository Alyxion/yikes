[project]
name = "yikes"
version = "0.1.7"
description = "Terminal-first runtime for Claude Code and Codex CLI — durable interactive sessions, Docker isolation, and a web control surface"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14,<4"
authors = [{ name = "Michael Ikemann" }]
keywords = ["claude-code", "codex", "cli", "tmux", "terminal", "agent", "tui", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Topic :: Software Development",
    "Topic :: Terminals",
    "Topic :: Utilities",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "fastapi>=0.100",
    "llming-com>=0.1.7",
    "llming-stage>=0.1.1",
    "rich>=14",
    "textual>=6",
    "typer>=0.12",
    "uvicorn[standard]>=0.27",
    "websockets>=16",
]

[project.urls]
Homepage = "https://github.com/Alyxion/yikes"
Repository = "https://github.com/Alyxion/yikes"
Documentation = "https://github.com/Alyxion/yikes/tree/main/docs"
Author = "https://github.com/Alyxion"

[project.scripts]
yikes = "yikes.cli:main"

[tool.poetry]
packages = [{ include = "yikes" }]
include = [
    { path = "yikes/web_static/**/*", format = ["sdist", "wheel"] },
]

[tool.poetry.group.dev.dependencies]
httpx = ">=0.27"
pytest = ">=8"
mkdocs = ">=1.6"
mkdocs-material = ">=9.5"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: real end-to-end tests that invoke Claude Code, Codex, and tmux",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

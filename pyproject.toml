[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "yikes"
version = "0.1.0"
description = "Unified chatbot driver for Claude Code and Codex CLI"
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
  "rich>=14",
  "textual>=6",
  "typer>=0.12",
  "websockets>=16",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
yikes = "yikes.cli:main"

[tool.poetry]
packages = [{ include = "yikes" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: real end-to-end tests that invoke Claude Code, Codex, and tmux",
]

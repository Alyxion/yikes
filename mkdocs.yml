site_name: yikes!
site_description: A runtime layer for Claude Code and Codex CLI across host, Docker, tmux, Python, and web backends.
repo_url: https://github.com/michael-ikemann/yikes
repo_name: yikes!
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.indexes
    - navigation.top
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/diagram-lightbox.js

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Anchor link to this section
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

nav:
  - Overview: index.md
  - Architecture: architecture.md
  - Backends:
      - backends/index.md
      - Claude Code: backends/claude-code.md
      - Codex: backends/codex.md
  - tmux Layer: tmux-layer.md
  - Streaming & Updates: streaming.md
  - Activity & Training: activity-training.md
  - Python Library: python-library.md
  - Embedding: embedding.md
  - OpenHort Parity: openhort-parity.md
  - CLI Wrapper: cli-wrapper.md
  - Roadmap: roadmap.md
  - Changes:
      - OpenHort Alignment: changes/openhort-alignment.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/michael-ikemann/yikes
